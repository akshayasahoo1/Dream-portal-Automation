<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dreams Total</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="panel" style="min-width:520px">
    <h1>Dream Statistics</h1>
    <div class="stats">
      <div class="stat"><div class="num" id="good">0</div><div class="label">Good Dreams</div></div>
      <div class="stat"><div class="num" id="bad">0</div><div class="label">Bad Dreams</div></div>
      <div class="stat"><div class="num" id="total">0</div><div class="label">Total Dreams</div></div>
      <div class="stat"><div class="num" id="recurring">0</div><div class="label">Recurring Dreams</div></div>
    </div>
  </div>
  <script src="dreams-data.js"></script>
  <script>
    var target = {
      good: window.DREAMS.filter(function (d) { return d.type === 'Good'; }).length,
      bad: window.DREAMS.filter(function (d) { return d.type === 'Bad'; }).length,
      total: window.DREAMS.length,
      recurring: window.recurringNames().length,
    };
    // count-up animation (~1s) to make sure the tests cope with values that are still changing
    Object.keys(target).forEach(function (k) {
      var el = document.getElementById(k), n = 0;
      var t = setInterval(function () {
        n = Math.min(n + 1, target[k]); el.textContent = n;
        if (n >= target[k]) clearInterval(t);
      }, 150);
    });
  </script>
</body>
</html>
